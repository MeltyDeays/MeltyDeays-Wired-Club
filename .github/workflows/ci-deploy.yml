name: CI / CD - Pruebas y Publicación

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verificación y Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar Suite de Pruebas
        run: npm test

  publish:
    name: Publicación y Despliegue
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        continue-on-error: true
        run: npm install --global vercel@latest

      - name: Desplegar en Producción (Vercel)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice ::VERCEL_TOKEN no configurado en Secrets. Despliegue gestionado por Vercel GitHub App nativo."
          else
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN || echo "Aviso: Delegando build a Vercel GitHub App"
            vercel build --prod --token=$VERCEL_TOKEN || echo "Aviso: Delegando build a Vercel"
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN || echo "Aviso: Despliegue delegado a Vercel"
          fi

      - name: Desplegar en Preview (Vercel)
        if: github.ref == 'refs/heads/develop'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice ::VERCEL_TOKEN no configurado en Secrets. Despliegue gestionado por Vercel GitHub App nativo."
          else
            vercel pull --yes --environment=preview --token=$VERCEL_TOKEN || echo "Aviso: Delegando build a Vercel GitHub App"
            vercel build --token=$VERCEL_TOKEN || echo "Aviso: Delegando build a Vercel"
            vercel deploy --prebuilt --token=$VERCEL_TOKEN || echo "Aviso: Despliegue delegado a Vercel"
          fi
