name: Vercel Continuous Deployment

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Despliegue de Pruebas (Develop -> Preview)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@60.1.3

      - name: Link Project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_jFD2GVHb9KmvuVCxQQsZvLkHhGU5","orgId":"team_vaS1CBmW92Fj6Oz0pdCXPZRc"}' > .vercel/project.json

      - name: Deploy to Vercel Preview
        run: |
          echo "Running vercel deploy with verbose diagnostics..."
          OUTPUT=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1) || STATUS=$?
          echo "Output was: $OUTPUT"
          # Replace newlines with space for single-line annotation
          CLEAN_MSG=$(echo "$OUTPUT" | tr '\n' ' ')
          echo "::error title=VercelDeployOutput::$CLEAN_MSG"
          if [ -n "$STATUS" ] && [ "$STATUS" -ne 0 ]; then
            exit $STATUS
          fi

  deploy-production:
    name: Despliegue de Producción (Main -> Prod)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@60.1.3

      - name: Link Project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_jFD2GVHb9KmvuVCxQQsZvLkHhGU5","orgId":"team_vaS1CBmW92Fj6Oz0pdCXPZRc"}' > .vercel/project.json

      - name: Deploy to Vercel Production
        run: |
          echo "Attempting prebuilt deployment pipeline..."
          if vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            echo "Vercel pull failed. Falling back to direct deployment..."
            vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
          fi
