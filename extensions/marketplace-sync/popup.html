<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Haibane Marketplace Sync</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .header h1 {
      margin: 0;
      font-size: 13px;
      color: #fbbf24;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #064e3b;
      color: #34d399;
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid #059669;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
    }
    .info-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .info-card strong {
      color: #38bdf8;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 5px;
      border: none;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #d97706;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #b45309;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .log-box {
      margin-top: 10px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 4px;
      padding: 8px;
      font-family: monospace;
      font-size: 10px;
      color: #94a3b8;
      max-height: 70px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>✦ HAIBANE SYNC</h1>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>FIRESTORE 24/7</span>
    </div>
  </div>

  <div class="info-card">
    <div><strong>Perfil FB:</strong> 100071051942718</div>
    <div><strong>Proyecto:</strong> lain-wired-club</div>
    <div><strong>Regla de Agotado:</strong> Ocultación auto a las 12h</div>
  </div>

  <div class="actions">
    <button id="btn-audit" class="btn btn-primary">
      🔄 Auditar Pestaña de Facebook
    </button>
    <button id="btn-cloud-sync" class="btn btn-secondary">
      ☁️ Forzar Sincronización Vercel Cloud
    </button>
  </div>

  <div id="log" class="log-box">Listo para sincronizar.</div>

  <script src="popup.js" type="module"></script>
</body>
</html>
